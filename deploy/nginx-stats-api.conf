# Private stats API - nginx reverse proxy with HTTPS
# Domain: api.<your-domain> (e.g. api.thesyncmusic.vercel.app)
# Bot listens on 127.0.0.1:3001, nginx terminates TLS and proxies.
#
# Oracle setup (Ubuntu):
#   1. Point DNS A record: api.<your-domain> -> <oracle-public-ip>
#   2. Open port 80/443 in OCI Security List + firewalld/iptables
#   3. sudo apt install -y nginx certbot python3-certbot-nginx
#   4. sudo cp deploy/nginx-stats-api.conf /etc/nginx/sites-available/stats-api
#      (replace api.<your-domain> below, then symlink to sites-enabled)
#   5. sudo nginx -t && sudo systemctl reload nginx
#   6. sudo certbot --nginx -d api.<your-domain>   # HTTPS, auto-redirect
#      (run AFTER the HTTP-only server below is live; certbot adds the
#      443 ssl listener + certificate directives automatically)
#   7. Keep STATS_API_HOST=127.0.0.1 so node is NOT directly reachable.
#
# Vercel fetches server-side only with:
#   Authorization: Bearer $STATS_API_KEY

upstream sync_stats {
    server 127.0.0.1:3001;
    keepalive 16;
}

# Edge rate-limit state belongs in the http context (beside the upstream),
# not inside a server block - nginx rejects limit_req_zone in server.
limit_req_zone $binary_remote_addr zone=stats:10m rate=30r/m;

# Bootstrap server is HTTP-only so nginx starts before certificates exist.
# Certbot --nginx obtains certs via the acme-challenge below, then enables
# the HTTPS listener + certificate settings automatically.
server {
    listen 80;
    server_name api.CHANGEME.example.com;

    # Allow certbot HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Private API: no CORS (Vercel calls server-side, key stays secret)
    # No caching of auth responses at edge
    add_header Cache-Control "private, no-store" always;

    # Rate-limit + size guards at edge (app also limits 30/min)
    client_max_body_size 4k;

    location /api/ {
        limit_req zone=stats burst=10 nodelay;
        proxy_pass http://sync_stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward the Bearer token untouched
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Health probe for uptime monitors - must come before the catch-all
    location = /health {
        limit_req zone=stats burst=10 nodelay;
        proxy_pass http://sync_stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_connect_timeout 5s;
    }

    # Block everything else
    location / {
        return 404 '{"error":"Not found"}';
        add_header Content-Type application/json always;
    }
}
